[package]
authors = ["Gipson62 <j.h.gipson62@gmail.com>"]
name = "win-term"
version = "0.2.0"
edition = "2021"
keywords = ["windows", "terminal", "console", "size", "pixel"]
homepage = "https://github.com/Gipson62/win-term"
repository = "https://github.com/Gipson62/win-term"
description = "Fetch terminal size in pixel"
license = "MIT"


[dependencies]
windows = "0.58.0"

[dependencies.windows-sys]
version = "0.59.0"
features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_HiDpi",
]
